[project]
name = "scholarship-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "fastapi[all]>=0.140.7",
    "jwt>=1.4.0",
    "mypy-boto3-s3>=1.43.66",
    "passlib>=1.7.4",
    "pogo-migrate>=0.4.6",
    "pydantic>=2.13.4",
    "pypika>=0.51.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlparse>=0.5.5",
    "supabase>=2.31.0",
    "types-aiobotocore[s3]>=3.9.0",
]

[tool.pogo]
migrations = './migrations'
database_config = '{POGO_DATABASE}'
schema = 'public'

[tool.basedpyright]
typeCheckingMode = 'standard'
